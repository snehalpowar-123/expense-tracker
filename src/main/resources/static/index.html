<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker - Pune</title>
    <style>
        body{font-family:Arial;background:#f5f5f5;padding:20px}
        .card{background:white;padding:20px;border-radius:12px;max-width:500px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
        input,button{padding:10px;margin:5px;width:90%;border-radius:6px;border:1px solid #ccc}
        button{background:#007bff;color:white;border:none;cursor:pointer}
        li{margin:8px 0;background:#eee;padding:8px;border-radius:6px}
    </style>
</head>
<body>
<div class="card">
    <h2>💰 Expense Tracker</h2>
    <input id="title" placeholder="Title e.g. Chai, Bus">
    <input id="amount" type="number" placeholder="Amount">
    <input id="category" placeholder="Category e.g. Food">
    <button onclick="addExpense()">Add Expense</button>
    <ul id="list"></ul>
    <h3 id="total"></h3>
</div>
<script>
    const API="http://localhost:8081/api/expenses";
    function load(){
        fetch(API).then(r=>r.json()).then(data=>{
            let list=document.getElementById("list"); list.innerHTML="";
            let sum=0; data.forEach(e=>{
                sum+=e.amount;
                list.innerHTML+=`<li>${e.title} - ₹${e.amount} (${e.category}) <button onclick="del(${e.id})">X</button></li>`;
            });
            document.getElementById("total").innerText="Total: ₹"+sum;
        })
    }
    function addExpense(){
        fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({title:title.value,amount:amount.value,category:category.value})})
            .then(()=>{title.value="";amount.value="";category.value="";load();})
    }
    function del(id){fetch(API+"/"+id,{method:"DELETE"}).then(()=>load())}
    load();
</script>
</body>
</html>
